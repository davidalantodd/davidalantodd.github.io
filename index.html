<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/ico" href="/d-logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="David Todd, a mission-driven software engineer in Washington, D.C." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" />
    <title>David Todd's Portfolio</title>
    <script>
      // set the theme before the first paint: the visitor's saved choice, otherwise their system setting
      (function () {
        var saved = function () {
          try { return localStorage.getItem('theme') } catch (e) { return null }
        }
        var system = window.matchMedia('(prefers-color-scheme: dark)')
        document.documentElement.dataset.theme = saved() || (system.matches ? 'dark' : 'light')
        // follow the system setting live, until the visitor picks a theme themselves
        system.addEventListener('change', function () {
          if (!saved()) {
            document.documentElement.dataset.theme = system.matches ? 'dark' : 'light'
            window.dispatchEvent(new Event('themechange'))
          }
        })
      })()
    </script>
    <!-- without JavaScript the sandpiper can't walk, so show its lines in full -->
    <noscript><style>.line { opacity: 1; }</style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
